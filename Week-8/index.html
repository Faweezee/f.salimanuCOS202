<!doctype html>
<html lang="en">
  <head>
    <!-- A HTML file can only have one head, body and html tag -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Fawaz Salimanu" />
    <meta
      name="description"
      content="This is about html elements and semantics"
    />
    <meta name="keywords" content="HTML, CSS, JavaScript" />
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon" />
    <!-- It can have multiple meta tags (with different attributes), links, and other elements -->
    <title>Introduction to HTML</title>
    <link rel="stylesheet" href="./sty.css" />
  </head>
  <body>
    <nav>
      <ul>
        <li><a href="./index.html">home</a></li>
        <li><a href="./about.html">about us</a></li>

        <li><a href="/Week-8/login/index.html">log in</a></li>
        <li><a href="https://pau.edu.ng/">school</a></li>
      </ul>
    </nav>
    <main>
      <header>
        <h1>Intoduction to html</h1>
      </header>
      <h2>semantic elements</h2>
      <h2>multimedia elements</h2>
      <p>The president of Nigeria is <strong>stupid</strong></p>
      <p>He said <em>je veux manger</em></p>
      <!-- // ol>li*6 -->
      <ol type="A" reversed start="20">
        <li>main</li>
        <li>section</li>
        <li>aside</li>
        <li>footer</li>
        <li>article</li>
        <li>nav</li>
      </ol>
    </main>

    <!-- (sect>h2p+p)+(aside>ol>li{list$}*4) -->
    <section>
      <h2></h2>
      <p></p>
    </section>
    <aside>
      <ol>
        <li>list1</li>
        <li>list2</li>
        <li>list3</li>
        <li>list4</li>
      </ol>
    </aside>
